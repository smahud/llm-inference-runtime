[project]
name = "llm-inference-runtime"
version = "1.0.0"
description = "High-throughput, multi-GPU LLM inference gateway with dynamic batching, vLLM engine integration, and token streaming"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Huda Choirul Anam", email = "huda@smahud.dev"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "vllm>=0.5.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "prometheus-client>=0.19.0",
    "redis>=5.0.0",
    "aiohttp>=3.9.0",
    "python-multipart>=0.0.6",
    "python-json-logger>=2.0.0",
    "structlog>=24.1.0",
    "httpx>=0.26.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W", "C4", "C9", "PT", "T20"]
ignore = ["E501", "C901"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]